<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f6f7f9;--surface:#fff;--ink:#1e293b;--ink2:#64748b;--ink3:#94a3b8;
  --line:#e2e8f0;--line2:#f1f5f9;
  --purple:#7c3aed;--purple-d:#5b21b6;--purple-s:#ede9fe;--purple-t:#ddd6fe;
  --rose:#e11d48;--rose-s:#fff1f2;--rose-t:#fecdd3;
  --teal:#0d9488;--teal-s:#f0fdfa;--teal-t:#99f6e4;
  --amber:#d97706;--amber-s:#fffbeb;--amber-t:#fde68a;
  --blue:#2563eb;--blue-s:#eff6ff;--blue-t:#bfdbfe;
  --green:#16a34a;--green-s:#f0fdf4;
  --red:#dc2626;--red-s:#fef2f2;
}
body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.shell{min-height:100vh;max-width:640px;margin:0 auto;padding:0 0 96px;}
.serif{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}

/* Header */
.hdr{background:linear-gradient(135deg,#3b0764,#5b21b6 50%,#7c3aed);padding:calc(18px + env(safe-area-inset-top)) 18px 18px;color:#fff;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.hdr-dog{display:flex;align-items:center;gap:12px;}
.hdr-avatar{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid rgba(255,255,255,0.25);overflow:hidden;flex-shrink:0;}
.hdr-avatar img{width:100%;height:100%;object-fit:cover;}
.hdr-name{font-family:'Fraunces',serif;font-weight:700;font-size:22px;letter-spacing:-0.3px;}
.hdr-sub{font-size:12px;opacity:0.75;margin-top:2px;}
.hdr-save{font-size:11px;opacity:0.7;display:flex;align-items:center;gap:4px;}
.hdr-btns{display:flex;gap:8px;align-items:center;}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.15);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;position:relative;flex-shrink:0;}
.notif-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#f43f5e;border:1.5px solid transparent;}
.hdr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hdr-stat{background:rgba(255,255,255,0.12);border-radius:12px;padding:8px 10px;text-align:center;}
.hdr-stat-val{font-size:13px;font-weight:700;}
.hdr-stat-lbl{font-size:10px;opacity:0.7;margin-top:2px;}

/* Alert banner */
.alert-banner{margin:14px 14px 0;background:var(--rose-s);border:1px solid var(--rose-t);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;}
.alert-banner-icon{font-size:18px;flex-shrink:0;}
.alert-banner-title{font-weight:700;font-size:13px;color:var(--rose);margin-bottom:4px;}
.alert-banner-body{font-size:12px;color:#9f1239;line-height:1.6;}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;box-shadow:0 -4px 16px -8px rgba(0,0,0,0.15);}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink3);font-size:10px;font-weight:600;cursor:pointer;padding:4px 10px;font-family:'Inter',sans-serif;transition:color 0.15s;}
.bnav-item.active{color:var(--purple);}
.bnav-icon{font-size:20px;}

/* Section */
.section{padding:14px;}
.section-title{font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--ink);margin-bottom:14px;}

/* Cards */
.card{background:var(--surface);border-radius:16px;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:10px;overflow:hidden;}
.card-stripe{border-left:4px solid var(--stripe,var(--purple));}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;}
.card-title{font-weight:700;font-size:14px;color:var(--ink);}
.card-body{padding:8px 16px 14px;}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;}
.card-row:last-child{border-bottom:none;}
.card-row-label{color:var(--ink2);flex-shrink:0;margin-right:8px;}
.card-row-val{font-weight:600;color:var(--ink);text-align:right;word-break:break-word;}

/* Record item */
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
.rec-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.rec-title{font-weight:700;font-size:13px;color:var(--ink);}
.rec-date{font-size:11px;color:var(--ink3);font-family:'JetBrains Mono',monospace;flex-shrink:0;margin-left:8px;}
.rec-note{font-size:12px;color:var(--ink2);line-height:1.5;margin-top:3px;}
.rec-next{display:inline-flex;align-items:center;gap:4px;margin-top:6px;background:var(--purple-s);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--purple-d);font-weight:600;}
.rec-next.overdue{background:var(--rose-s);color:var(--rose);}
.rec-next.soon{background:var(--amber-s);color:var(--amber);}
.rec-actions{display:flex;gap:6px;margin-top:8px;}
.rec-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;font-weight:600;}
.rec-btn.edit{border-color:var(--purple-t);color:var(--purple);}
.rec-btn.del{border-color:var(--rose-t);color:var(--rose);}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-ok{background:var(--green-s);color:var(--green);}
.badge-warn{background:var(--amber-s);color:var(--amber);}
.badge-high{background:var(--red-s);color:var(--red);}
.badge-low{background:var(--blue-s);color:var(--blue);}

/* Lab rows */
.lab-row{padding:10px 0;border-bottom:1px solid var(--line2);}
.lab-row:last-child{border-bottom:none;}
.lab-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.lab-name{font-size:13px;font-weight:500;color:var(--ink);}
.lab-val-wrap{display:flex;align-items:center;gap:6px;}
.lab-val{font-size:14px;font-weight:700;}
.lab-unit{font-size:11px;color:var(--ink3);}
.lab-bar-wrap{display:flex;align-items:center;gap:5px;}
.lab-bar-ref{font-size:10px;color:var(--ink3);min-width:28px;}
.lab-bar{flex:1;height:4px;background:var(--line);border-radius:4px;position:relative;overflow:hidden;}
.lab-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:4px;}

/* Inputs */
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);outline:none;}
.inp:focus{border-color:var(--purple);}
.inp-label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px;display:block;}
.inp-group{margin-bottom:12px;}
textarea.inp{resize:vertical;min-height:70px;}

/* Form sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(15,15,25,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
.sheet-title{font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--ink);margin-bottom:16px;}
.sheet-btns{display:flex;gap:10px;margin-top:16px;}
.btn{border:none;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity 0.15s;}
.btn:active{opacity:0.8;}
.btn-primary{background:var(--purple);color:#fff;flex:1;}
.btn-ghost{background:var(--line2);color:var(--ink2);}
.btn-danger{background:var(--rose-s);color:var(--rose);flex:1;border:1px solid var(--rose-t);}

/* Notif panel */
.notif-overlay{position:fixed;inset:0;background:rgba(15,15,25,0.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:60px 14px 14px;}
.notif-panel{background:var(--surface);border-radius:20px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;box-shadow:0 24px 60px -12px rgba(0,0,0,0.35);}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);}
.notif-head-title{font-family:'Fraunces',serif;font-weight:700;font-size:17px;}
.notif-body{padding:10px 14px 16px;}
.notif-section{margin-top:12px;}
.notif-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink3);margin-bottom:8px;}
.notif-row{display:flex;align-items:center;gap:10px;background:var(--line2);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:13px;}
.notif-row-icon{font-size:16px;}
.notif-row-text{flex:1;font-weight:600;color:var(--ink);}
.notif-row-date{font-size:11px;color:var(--ink3);font-family:'JetBrains Mono',monospace;}
.notif-empty{text-align:center;padding:24px 0;color:var(--ink3);font-size:14px;}

/* Tabs inside section */
.subtabs{display:flex;background:var(--line2);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px;}
.subtab{flex:1;border:none;background:none;border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:'Inter',sans-serif;}
.subtab.active{background:var(--surface);color:var(--purple);box-shadow:0 1px 4px rgba(0,0,0,0.08);}

/* Add button */
.add-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
.add-btn{display:inline-flex;align-items:center;gap:5px;background:var(--purple-s);border:none;color:var(--purple-d);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;}
.add-btn:active{opacity:0.8;}

/* Photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.photo-tile{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line2);position:relative;cursor:pointer;}
.photo-tile img{width:100%;height:100%;object-fit:cover;}
.photo-tile-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--ink3);border:1.5px dashed var(--line);border-radius:12px;cursor:pointer;}
.photo-tile-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:6px;width:22px;height:22px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.photo-tile-main{position:absolute;bottom:4px;left:4px;background:var(--purple);color:#fff;font-size:9px;font-weight:700;border-radius:6px;padding:2px 6px;text-transform:uppercase;}

/* Doc list */
.doc-item{display:flex;align-items:center;gap:10px;background:var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:6px;}
.doc-icon{font-size:18px;flex-shrink:0;}
.doc-body{flex:1;min-width:0;}
.doc-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-meta{font-size:11px;color:var(--ink3);margin-top:2px;}
.doc-link{color:var(--purple);font-size:11px;font-weight:600;text-decoration:none;}
.doc-del{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:16px;padding:2px;}

/* Progress upload */
.upload-progress{background:var(--line2);border-radius:8px;height:6px;overflow:hidden;margin-top:8px;}
.upload-progress-fill{height:100%;background:var(--purple);border-radius:8px;transition:width 0.3s;}

/* Backup bar */
.backup-bar{display:flex;gap:8px;flex-wrap:wrap;background:var(--amber-s);border:1px solid var(--amber-t);border-radius:12px;padding:10px 14px;margin:14px 14px 0;font-size:12px;color:#78350f;align-items:center;}
.backup-bar-text{flex:1;min-width:140px;}
.backup-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--amber-t);color:#78350f;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;}

/* History */
.hist-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px;}
.hist-row:last-child{border-bottom:none;}
.hist-dot{width:8px;height:8px;border-radius:50%;background:var(--purple);margin-top:4px;flex-shrink:0;}
.hist-body{flex:1;}
.hist-what{font-weight:600;color:var(--ink);}
.hist-when{color:var(--ink3);margin-top:1px;}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;color:var(--purple);}
.loading-title{font-family:'Fraunces',serif;font-weight:700;font-size:18px;}
.spinner{width:36px;height:36px;border:3px solid var(--purple-s);border-top-color:var(--purple);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Inline editable */
.inline-edit-wrap{cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2);}
.inline-edit-wrap:last-child{border-bottom:none;}
.inline-edit-label{font-size:13px;color:var(--ink2);flex-shrink:0;margin-right:8px;}
.inline-edit-val{font-size:13px;font-weight:600;color:var(--ink);text-align:right;word-break:break-word;}
.inline-edit-hint{font-size:9px;color:var(--purple-t);margin-left:4px;}

/* Save toast */
.toast{position:fixed;top:16px;right:16px;z-index:500;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 24px -6px rgba(0,0,0,0.25);display:flex;align-items:center;gap:6px;}
.toast-ok{background:#4c1d95;color:#fff;}
.toast-err{background:var(--rose);color:#fff;}
.toast-saving{background:var(--ink);color:#fff;}

@media(max-width:400px){.hdr-name{font-size:19px;}}
</style>
</head>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ── helpers ───────────────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtDate(iso){
  if(!iso)return"—";
  const[y,m,d]=iso.split("-");
  const mo=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  return `${parseInt(d)} ${mo[parseInt(m)-1]} ${y}`;
}
function fmtDateShort(s){
  if(!s||s==="—")return"—";
  const p=s.split(/[.\-\/]/);
  if(p.length===3&&p[2].length===4)return`${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
  return s;
}
function parseDateMs(s){
  if(!s||s==="—")return 0;
  const p=s.split(/[.\-\/]/);
  if(p.length===3){
    const[a,b,c]=p;
    if(c&&c.length===4)return new Date(`${c}-${b.padStart(2,"0")}-${a.padStart(2,"0")}`).getTime();
    if(a&&a.length===4)return new Date(`${a}-${b.padStart(2,"0")}-${c.padStart(2,"0")}`).getTime();
  }
  if(/^\d{2}\.\d{4}$/.test(s)){const[m,y]=s.split(".");return new Date(`${y}-${m}-01`).getTime();}
  if(/^\d{4}$/.test(s))return new Date(`${s}-01-01`).getTime();
  return 0;
}
function daysUntil(isoDate){
  if(!isoDate)return null;
  const diff=new Date(isoDate)-new Date(todayISO());
  return Math.round(diff/(1000*86400));
}
function autoStatus(value,refMin,refMax){
  const v=parseFloat(value),mn=parseFloat(refMin),mx=parseFloat(refMax);
  if(isNaN(v)||isNaN(mn)||isNaN(mx))return"ok";
  if(v<mn)return"low";
  if(v>mx)return((v-mn)/(mx-mn))>1.15?"high":"warn";
  return"ok";
}

// ── useDB hook ─────────────────────────────────────────────────────────────────
function useDB(){
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[saveState,setSaveState]=useState("idle"); // idle | saving | saved | error | offline
  const latest=useRef(null);

  const persist=useCallback((next,histEntry)=>{
    const payload={...next};
    if(histEntry){
      payload.history=[{id:uid(),ts:new Date().toISOString(),...histEntry},...(next.history||[])].slice(0,50);
    }
    latest.current=payload;
    setData(payload);
    setSaveState("saving");
    // also save to localStorage as offline cache
    try{localStorage.setItem("ls-cache-v1",JSON.stringify(payload));}catch(_){}
    DOC_REF.set(payload)
      .then(()=>{setSaveState("saved");setTimeout(()=>setSaveState(s=>s==="saved"?"idle":s),2000);})
      .catch(()=>{setSaveState("error");setTimeout(()=>setSaveState(s=>s==="error"?"offline":s),4000);});
  },[]);

  useEffect(()=>{
    const unsub=DOC_REF.onSnapshot(snap=>{
      if(snap.exists){
        const d=snap.data();
        latest.current=d;
        setData(d);
      } else {
        // first load — use defaults
        const d={...DEFAULT};
        latest.current=d;
        setData(d);
        DOC_REF.set(d).catch(console.error);
      }
      setLoading(false);
    },err=>{
      console.error("Firestore error:",err);
      setSaveState("offline");
      // try cache
      try{
        const cached=localStorage.getItem("ls-cache-v1");
        if(cached){const d=JSON.parse(cached);latest.current=d;setData(d);}
        else{latest.current=DEFAULT;setData(DEFAULT);}
      }catch(_){latest.current=DEFAULT;setData(DEFAULT);}
      setLoading(false);
    });
    return()=>unsub();
  },[]);

  const exportJSON=useCallback(()=>{
    if(!latest.current)return;
    const blob=new Blob([JSON.stringify(latest.current,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`lucky-star-backup-${todayISO()}.json`;
    a.click();
  },[]);

  const importJSON=useCallback((file)=>{
    const r=new FileReader();
    r.onload=e=>{try{const d=JSON.parse(e.target.result);persist(d,{what:"Импорт резервной копии",section:"system"});}catch(_){alert("Ошибка чтения файла");}};
    r.readAsText(file);
  },[persist]);

  return{data,loading,persist,saveState,exportJSON,importJSON};
}

// ── Notification logic ────────────────────────────────────────────────────────
function collectNotifications(data){
  if(!data)return[];
  const today=todayISO();
  const future=new Date();future.setDate(future.getDate()+14);
  const in14=future.toISOString().slice(0,10);
  const items=[];
  (data.vaccinations||[]).forEach(v=>{
    if(!v.nextDate)return;
    if(v.nextDate<=in14){
      const d=daysUntil(v.nextDate);
      items.push({id:v.id,icon:v.type==="vaccine"?"💉":"🧴",title:v.name,date:v.nextDate,days:d,
        bucket:v.nextDate<today?"overdue":v.nextDate===today?"today":"soon"});
    }
  });
  (data.prescriptions||[]).forEach(p=>{
    if(!p.nextDate)return;
    if(p.nextDate<=in14){
      const d=daysUntil(p.nextDate);
      items.push({id:p.id,icon:"💊",title:p.name,date:p.nextDate,days:d,
        bucket:p.nextDate<today?"overdue":p.nextDate===today?"today":"soon"});
    }
  });
  return items.sort((a,b)=>a.date.localeCompare(b.date));
}

function Toast({state}){
  if(state==="idle")return null;
  const cfg={
    saving:{cls:"toast toast-saving",text:"☁️ Сохраняется…"},
    saved:{cls:"toast toast-ok",text:"✓ Сохранено в облако"},
    error:{cls:"toast toast-err",text:"⚠️ Ошибка сохранения"},
    offline:{cls:"toast toast-err",text:"📴 Офлайн — данные в кэше"},
  };
  const c=cfg[state];if(!c)return null;
  return <div className={c.cls}>{c.text}</div>;
}

function Badge({status,children}){
  const c=SC[status]||SC.ok;
  return <span className="badge" style={{background:c.bg,color:c.color}}>
    <span style={{width:5,height:5,borderRadius:"50%",background:c.dot,display:"inline-block"}}/>
    {children||c.label}
  </span>;
}

function LabRow({row}){
  const isText=isNaN(parseFloat(row.value));
  const pct=isText?50:Math.min(100,Math.max(0,((parseFloat(row.value)-(row.refMin||0))/((row.refMax||1)-(row.refMin||0)))*100));
  const c=SC[row.status]||SC.ok;
  return <div className="lab-row">
    <div className="lab-row-top">
      <span className="lab-name">{row.name}</span>
      <div className="lab-val-wrap">
        <span className="lab-val" style={{color:c.color}}>{row.value}</span>
        {row.unit&&<span className="lab-unit">{row.unit}</span>}
        <Badge status={row.status}/>
      </div>
    </div>
    {!isText&&row.refMax&&<div className="lab-bar-wrap">
      <span className="lab-bar-ref">{row.refMin}</span>
      <div className="lab-bar"><div className="lab-bar-fill" style={{width:`${pct}%`,background:c.dot}}/></div>
      <span className="lab-bar-ref" style={{textAlign:"right"}}>{row.refMax}</span>
    </div>}
  </div>;
}

function RecordItem({item,fields,accent,onSave,onDelete,renderBody}){
  const[editing,setEditing]=useState(false);
  const[vals,setVals]=useState(()=>Object.fromEntries(fields.map(f=>[f.key,item[f.key]||""])));
  useEffect(()=>setVals(Object.fromEntries(fields.map(f=>[f.key,item[f.key]||""]))),[item]);
  const set=(k,v)=>setVals(p=>({...p,[k]:v}));

  const nextDays=item.nextDate?daysUntil(item.nextDate):null;
  const nextCls=nextDays===null?"":(nextDays<0?"overdue":nextDays<=3?"soon":"");

  if(editing)return <div className="rec" style={{borderLeft:`3px solid ${accent}`}}>
    {fields.map(f=><div key={f.key} className="inp-group">
      <label className="inp-label">{f.label}</label>
      {f.multiline
        ?<textarea className="inp textarea" value={vals[f.key]} onChange={e=>set(f.key,e.target.value)}/>
        :<input className="inp" type={f.type||"text"} value={vals[f.key]} onChange={e=>set(f.key,e.target.value)}/>}
    </div>)}
    <div className="sheet-btns">
      <button className="btn btn-primary" onClick={()=>{onSave(vals);setEditing(false);}}>Сохранить</button>
      <button className="btn btn-ghost" onClick={()=>setEditing(false)}>Отмена</button>
    </div>
  </div>;

  return <div className="rec" style={{borderLeft:`3px solid ${accent}`}}>
    {renderBody(item)}
    {item.nextDate&&<div className={`rec-next ${nextCls}`}>
      {nextDays<0?`⚠️ Просрочено на ${Math.abs(nextDays)} дн.`:nextDays===0?"📅 Сегодня":`📅 Через ${nextDays} дн. — ${fmtDate(item.nextDate)}`}
    </div>}
    <div className="rec-actions">
      <button className="rec-btn edit" onClick={()=>setEditing(true)}>✏️ Изменить</button>
      <button className="rec-btn del" onClick={onDelete}>✕ Удалить</button>
    </div>
  </div>;
}

// Upload photo to Firebase Storage
function usePhotoUpload(){
  const[progress,setProgress]=useState(null);
  const[error,setError]=useState(null);
  const upload=useCallback((file,folder="photos")=>{
    return new Promise((resolve,reject)=>{
      setError(null);
      // Check file size — max 5MB
      if(file.size>5*1024*1024){
        const err="Файл слишком большой (макс. 5 МБ)";
        setError(err);reject(new Error(err));return;
      }
      const safeName=file.name.replace(/[^\w.\-]+/g,"_").replace(/\s+/g,"_");
      const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}-${safeName}`;
      try{
        const ref=storage.ref(path);
        const task=ref.put(file,{
          contentType:file.type||"application/octet-stream",
          customMetadata:{uploadedAt:new Date().toISOString(),originalName:file.name}
        });
        task.on("state_changed",
          snap=>{
            const pct=Math.round((snap.bytesTransferred/snap.totalBytes)*100);
            setProgress(pct);
          },
          err=>{
            setProgress(null);
            let msg="Ошибка загрузки";
            if(err.code==="storage/unauthorized")msg="Нет доступа — проверьте правила Storage";
            else if(err.code==="storage/canceled")msg="Загрузка отменена";
            else if(err.code==="storage/unknown")msg="Сетевая ошибка — проверьте интернет";
            else msg=err.message||err.code||"Неизвестная ошибка";
            setError(msg);
            reject(new Error(msg));
          },
          ()=>{
            setProgress(null);
            task.snapshot.ref.getDownloadURL()
              .then(url=>{setError(null);resolve(url);})
              .catch(e=>{setError("Файл загружен, но не удалось получить ссылку");reject(e);});
          }
        );
      }catch(e){
        setProgress(null);
        const msg="Ошибка инициализации загрузки: "+e.message;
        setError(msg);reject(new Error(msg));
      }
    });
  },[]);
  return{upload,progress,error};
}

function TabExams({data,persist}){
  const[open,setOpen]=useState(null);

  const[addingRow,setAddingRow]=useState(false);
  const[form,setForm]=useState({label:"",date:"",type:"Биохимия"});

  const exams=data.examinations||[];
  const filtered=filter==="Все"?exams:exams.filter(e=>e.type===filter);
  const sorted=[...filtered].sort((a,b)=>parseDateMs(b.date)-parseDateMs(a.date));
  const openExam=open?exams.find(e=>e.id===open):null;

  const addExam=()=>{
    if(!form.label)return;
    const nd={...data,examinations:[{id:uid(),...form,results:[]},...exams]};
    persist(nd,{what:`Добавлено обследование: ${form.label}`,section:"exams"});

  const delExam=(id)=>{

    const nd={...data,examinations:exams.filter(e=>e.id!==id)};
    persist(nd,{what:"Удалено обследование",section:"exams"});
    if(open===id)setOpen(null);
  };
  const addRow=()=>{
    if(!rowForm.name)return;
    const status=autoStatus(rowForm.value,rowForm.refMin,rowForm.refMax);
    const row={name:rowForm.name,value:parseFloat(rowForm.value)||rowForm.value,unit:rowForm.unit,
      refMin:parseFloat(rowForm.refMin)||0,refMax:parseFloat(rowForm.refMax)||0,status};
    const nd={...data,examinations:exams.map(e=>e.id!==open?e:{...e,results:[...e.results,row]})};
    persist(nd,{what:`Добавлен показатель: ${rowForm.name}`,section:"exams"});
    setAddingRow(false);setRowForm({name:"",value:"",unit:"",refMin:"",refMax:""});
  };

    const nd={...data,examinations:exams.map(e=>e.id!==examId?e:{...e,results:e.results.filter((_,i)=>i!==idx)})};

  if(openExam)return <div className="section">
    <button onClick={()=>setOpen(null)} style={{border:"none",background:"none",color:"var(--purple)",fontWeight:700,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",gap:4,marginBottom:14,padding:0}}>‹ Все обследования</button>
    <div className="card">

        <div className="card-title">{openExam.label}</div>

        <div style={{fontSize:12,color:"var(--ink3)",marginBottom:8,fontFamily:"JetBrains Mono,monospace"}}>{openExam.type} · {openExam.date}</div>
        {openExam.results.map((r,i)=><div key={i} style={{position:"relative"}}>

        </div>)}
        {openExam.results.length===0&&<div style={{color:"var(--ink3)",fontSize:13,padding:"8px 0"}}>Нет показателей</div>}
      </div>
    </div>
    {addingRow?<Sheet title="Добавить показатель" onClose={()=>setAddingRow(false)}>
      {[["name","Показатель"],["value","Значение"],["unit","Единица"],["refMin","Норма от"],["refMax","Норма до"]].map(([k,l])=>
        <div key={k} className="inp-group"><label className="inp-label">{l}</label>

    </Sheet>

  return <div className="section">
    <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:12,paddingBottom:2}}>

        const nd={...data,photos:[...(data.photos||[]),{id:uid(),url,name:file.name,date:todayISO()}]};
        persist(nd,{what:`Загружено фото: ${file.name}`,section:"photos"});
      }catch(err){alert("Ошибка загрузки: "+file.name+"\n"+err.message);}
    }
  };
  const delPhoto=(id)=>{
    if(!confirm("Удалить фото?"))return;
    const nd={...data,photos:(data.photos||[]).filter(p=>p.id!==id)};
    persist(nd,{what:"Удалено фото",section:"photos"});
  };
  const addDoc=()=>{
    if(!form.title)return;
    const nd={...data,documents:[{id:uid(),...form},...(data.documents||[])]};
    persist(nd,{what:`Добавлен документ: ${form.title}`,section:"documents"});
    setAdding(false);setForm({date:"",title:"",category:"Анализы",url:"",note:""});
  };
  const delDoc=(id)=>{
    if(!confirm("Удалить документ?"))return;
    const nd={...data,documents:(data.documents||[]).filter(d=>d.id!==id)};
    persist(nd,{what:"Удалён документ",section:"documents"});
  };
  const uploadDocFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const url=await upload(file,"documents");
      const nd={...data,documents:[{id:uid(),date:todayISO(),title:file.name,category:"Прочее",url,note:""},...(data.documents||[])]};
      persist(nd,{what:`Загружен файл: ${file.name}`,section:"documents"});
    }catch(_){alert("Ошибка загрузки");}
  };
  const cats=["Анализы","УЗИ","ЭКГ","Рентген","Выписки","Прочее"];
  const catColors={"Анализы":"var(--purple)","УЗИ":"var(--teal)","ЭКГ":"var(--rose)","Рентген":"var(--amber)","Выписки":"var(--green)","Прочее":"var(--ink3)"};
  const docs=[...(data.documents||[])].sort((a,b)=>parseDateMs(b.date)-parseDateMs(a.date));

  return <div className="section">
    <div className="subtabs">
      {[["photos","📷 Фото"],["docs","📎 Документы"]].map(([id,label])=>
        <button key={id} className={`subtab${subtab===id?" active":""}`} onClick={()=>setSubtab(id)}>{label}</button>)}
    </div>

    {subtab==="photos"&&<>
      <div style={{background:"var(--purple-s)",border:"1px dashed var(--purple-t)",borderRadius:12,padding:"12px 14px",fontSize:12,color:"var(--ink2)",marginBottom:12}}>
        Загружайте фото прямо с телефона — они сохраняются в Firebase Storage
      </div>
      <div className="add-row">
        <button className="add-btn" onClick={()=>fileRef.current.click()}>📷 Загрузить фото</button>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={uploadPhoto}/>
      </div>
      {progress!==null&&<div className="upload-progress"><div className="upload-progress-fill" style={{width:`${progress}%`}}/><div style={{fontSize:11,color:"var(--purple)",marginTop:4,textAlign:"center"}}>{progress}%</div></div>}
      {uploadError&&<div style={{background:"var(--red-s)",border:"1px solid var(--rose-t)",borderRadius:10,padding:"8px 12px",marginBottom:8,fontSize:12,color:"var(--red)",fontWeight:600}}>⚠️ {uploadError}</div>}
      <div className="photo-grid">
        {(data.photos||[]).map(p=>(
          <div key={p.id} className="photo-tile">
            <img src={p.url} alt={p.name}/>
            <button className="photo-tile-del" onClick={()=>delPhoto(p.id)}>✕</button>
          </div>
        ))}
        {(data.photos||[]).length===0&&<div style={{gridColumn:"1/-1",padding:"24px 0",textAlign:"center",color:"var(--ink3)",fontSize:13}}>Нет фотографий</div>}
      </div>
    </>}

    {subtab==="docs"&&<>
      <div className="add-row" style={{gap:8}}>
        <button className="add-btn" onClick={()=>setAdding(true)}>+ Ссылка</button>
        <button className="add-btn" onClick={()=>docFileRef.current.click()}>📤 Файл с телефона</button>
        <input ref={docFileRef} type="file" style={{display:"none"}} onChange={uploadDocFile}/>
      </div>
      {progress!==null&&<div className="upload-progress"><div className="upload-progress-fill" style={{width:`${progress}%`}}/></div>}
      {adding&&<Sheet title="Добавить документ" onClose={()=>setAdding(false)}>
        {[["date","Дата"],["title","Название"]].map(([k,l])=>
          <div key={k} className="inp-group"><label className="inp-label">{l}</label>
            <input className="inp" value={form[k]} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}/></div>)}
        <div className="inp-group"><label className="inp-label">Категория</label>
          <select className="inp" value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))}>
            {cats.map(c=><option key={c}>{c}</option>)}
          </select></div>
        <div className="inp-group"><label className="inp-label">Ссылка (Google Диск и т.д.)</label>
          <input className="inp" value={form.url} onChange={e=>setForm(p=>({...p,url:e.target.value}))}/></div>
        <div className="inp-group"><label className="inp-label">Примечание</label>
          <input className="inp" value={form.note} onChange={e=>setForm(p=>({...p,note:e.target.value}))}/></div>
        <div className="sheet-btns"><button className="btn btn-primary" onClick={addDoc}>Добавить</button><button className="btn btn-ghost" onClick={()=>setAdding(false)}>Отмена</button></div>
      </Sheet>}
      {cats.map(cat=>{
        const group=docs.filter(d=>d.category===cat);
        if(!group.length)return null;
        return <div key={cat} style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:catColors[cat]||"var(--ink3)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>{cat}</div>
          {group.map(d=>(
            <div key={d.id} className="doc-item">
              <div className="doc-icon">📄</div>
              <div className="doc-body">
                <div className="doc-name">{d.title}</div>
                <div className="doc-meta">{d.date}{d.note?" · "+d.note:""}</div>
                {d.url&&<a href={d.url} target="_blank" rel="noopener noreferrer" className="doc-link">🔗 Открыть</a>}
              </div>
              <button className="doc-del" onClick={()=>delDoc(d.id)}>✕</button>
            </div>
          ))}
        </div>;
      })}
    </>}
  </div>;
}

// ── Tab: History ──────────────────────────────────────────────────────────────
function TabHistory({data,exportJSON,importJSON,persistFromClaude}){
  const fileRef=useRef();
  const[showImport,setShowImport]=useState(false);
  const[importText,setImportText]=useState("");
  const[importResult,setImportResult]=useState(null);
  const hist=[...(data.history||[])].sort((a,b)=>b.ts.localeCompare(a.ts));
  const sectionIcon={profile:"🐾",diagnoses:"📋",visits:"🏥",vaccinations:"💉",prescriptions:"💊",photos:"📷",documents:"📎",exams:"🔬",system:"⚙️"};

  const runImport=()=>{
    try{
      const parsed=JSON.parse(importText);
      // Validate it's a Claude import packet
      if(!parsed.claudeImport)throw new Error("Неверный формат — нужен пакет из Claude");
      const result=[];

      // Merge examinations
      if(parsed.examinations&&parsed.examinations.length>0){
        const existing=data.examinations||[];
        const existingIds=new Set(existing.map(e=>e.id));
        const newExams=parsed.examinations.filter(e=>!existingIds.has(e.id));
        if(newExams.length>0){
          result.push(`✅ Добавлено обследований: ${newExams.length}`);
          data={...data,examinations:[...existing,...newExams]};
        } else {
          result.push("ℹ️ Обследования уже есть в карте");
        }
      }

      // Merge visits
      if(parsed.visits&&parsed.visits.length>0){
        const existing=data.visits||[];
        const existingIds=new Set(existing.map(v=>v.id));
        const newV=parsed.visits.filter(v=>!existingIds.has(v.id));
        if(newV.length>0){
          result.push(`✅ Добавлено визитов: ${newV.length}`);
          data={...data,visits:[...existing,...newV]};
        }
      }

      // Merge diagnoses
      if(parsed.diagnoses&&parsed.diagnoses.length>0){
        const existing=data.diagnoses||[];
        const existingIds=new Set(existing.map(d=>d.id));
        const newD=parsed.diagnoses.filter(d=>!existingIds.has(d.id));
        if(newD.length>0){
          result.push(`✅ Добавлено диагнозов: ${newD.length}`);
          data={...data,diagnoses:[...existing,...newD]};
        }
      }

      // Merge prescriptions
      if(parsed.prescriptions&&parsed.prescriptions.length>0){
        const existing=data.prescriptions||[];
        const existingIds=new Set(existing.map(p=>p.id));
        const newP=parsed.prescriptions.filter(p=>!existingIds.has(p.id));
        if(newP.length>0){
          result.push(`✅ Добавлено назначений: ${newP.length}`);
          data={...data,prescriptions:[...existing,...newP]};
        }
      }

      // Merge vaccinations
      if(parsed.vaccinations&&parsed.vaccinations.length>0){
        const existing=data.vaccinations||[];
        const existingIds=new Set(existing.map(v=>v.id));
        const newV=parsed.vaccinations.filter(v=>!existingIds.has(v.id));
        if(newV.length>0){
          result.push(`✅ Добавлено обработок/вакцинаций: ${newV.length}`);
          data={...data,vaccinations:[...existing,...newV]};
        }
      }

      if(result.length===0){
        setImportResult({ok:false,lines:["ℹ️ Нет новых данных для импорта"]});
        return;
      }
      persistFromClaude(data,`Импорт из Claude: ${result.join(", ")}`);
      setImportResult({ok:true,lines:result});
      setImportText("");
    }catch(e){
      setImportResult({ok:false,lines:["❌ Ошибка: "+e.message]});
    }
  };

  return <div className="section">

    {/* Claude Import */}
    <div style={{background:"#f0f4ff",border:"1.5px solid #c7d2fe",borderRadius:14,padding:"14px",marginBottom:16}}>
      <div style={{fontWeight:700,fontSize:13,color:"#3730a3",marginBottom:8}}>🤖 Импорт из Claude</div>
      <div style={{fontSize:12,color:"#4338ca",marginBottom:10,lineHeight:1.6}}>
        Загрузите фото анализов в Claude → получите JSON-пакет → вставьте сюда. Данные автоматически добавятся в карту.
      </div>
      {!showImport
        ?<button className="backup-btn" style={{background:"#4f46e5",color:"#fff",border:"none"}} onClick={()=>setShowImport(true)}>
          📋 Вставить данные от Claude
        </button>
        :<div>
          <textarea className="inp" style={{minHeight:120,fontSize:12,fontFamily:"JetBrains Mono,monospace"}}
            value={importText} onChange={e=>setImportText(e.target.value)}
            placeholder={'{\n  "claudeImport": true,\n  "examinations": [...],\n  ...\n}'}/>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button className="btn btn-primary" style={{fontSize:13}} onClick={runImport}>Импортировать</button>
            <button className="btn btn-ghost" style={{fontSize:13}} onClick={()=>{setShowImport(false);setImportText("");setImportResult(null);}}>Отмена</button>
          </div>
          {importResult&&<div style={{marginTop:10,padding:"10px 12px",borderRadius:10,background:importResult.ok?"var(--green-s)":"var(--red-s)",border:`1px solid ${importResult.ok?"#bbf7d0":"#fecaca"}`}}>
            {importResult.lines.map((l,i)=><div key={i} style={{fontSize:12,color:importResult.ok?"var(--green)":"var(--red)",fontWeight:600}}>{l}</div>)}
          </div>}
        </div>}
    </div>

    {/* Backup */}
    <div style={{background:"var(--amber-s)",border:"1px solid var(--amber-t)",borderRadius:14,padding:"12px 14px",marginBottom:16}}>
      <div style={{fontWeight:700,fontSize:13,color:"var(--amber)",marginBottom:8}}>💾 Резервное копирование</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button className="backup-btn" onClick={exportJSON}>⬇️ Скачать JSON</button>
        <button className="backup-btn" onClick={()=>fileRef.current.click()}>⬆️ Загрузить JSON</button>
        <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>{if(e.target.files[0])importJSON(e.target.files[0]);}}/>
      </div>
    </div>

    <div style={{fontFamily:"Fraunces,serif",fontWeight:700,fontSize:16,marginBottom:12,color:"var(--ink)"}}>История изменений</div>
    {hist.length===0&&<div style={{color:"var(--ink3)",fontSize:13,textAlign:"center",padding:"20px 0"}}>Нет записей</div>}
    <div className="card" style={{padding:"4px 14px"}}>
      {hist.map(h=>(
        <div key={h.id} className="hist-row">
          <div className="hist-dot" style={{background:h.section==="system"?"var(--ink3)":"var(--purple)"}}/>
          <div className="hist-body">
            <div className="hist-what">{sectionIcon[h.section]||"·"} {h.what}</div>
            <div className="hist-when">{new Date(h.ts).toLocaleString("ru-RU",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
          </div>
        </div>
      ))}
    </div>
  </div>;
}

// ── Notifications panel ───────────────────────────────────────────────────────
function NotifPanel({items,onClose}){
  const overdue=items.filter(i=>i.bucket==="overdue");
  const today=items.filter(i=>i.bucket==="today");
  const soon=items.filter(i=>i.bucket==="soon");

  return <div className="notif-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="notif-panel">
      <div className="notif-head">
        <div className="notif-head-title">🔔 Напоминания</div>
        <button onClick={onClose} style={{border:"none",background:"none",fontSize:22,cursor:"pointer",color:"var(--ink3)"}}>×</button>
      </div>
      <div className="notif-body">
        {items.length===0&&<div className="notif-empty">✅ Нет предстоящих процедур</div>}
        {overdue.length>0&&<div className="notif-section">
          <div className="notif-section-label" style={{color:"var(--rose)"}}>⚠️ Просрочено</div>
          {overdue.map(i=><div key={i.id} className="notif-row">
            <div className="notif-row-icon">{i.icon}</div>
            <div className="notif-row-text">{i.title}</div>
            <div className="notif-row-date" style={{color:"var(--rose)"}}>{fmtDate(i.date)}</div>
          </div>)}
        </div>}
        {today.length>0&&<div className="notif-section">
          <div className="notif-section-label" style={{color:"var(--teal)"}}>📅 Сегодня</div>
          {today.map(i=><div key={i.id} className="notif-row">
            <div className="notif-row-icon">{i.icon}</div>
            <div className="notif-row-text">{i.title}</div>
            <div className="notif-row-date">Сегодня</div>
          </div>)}
        </div>}
        {soon.length>0&&<div className="notif-section">
          <div className="notif-section-label" style={{color:"var(--amber)"}}>⏳ Скоро</div>
          {soon.map(i=><div key={i.id} className="notif-row">
            <div className="notif-row-icon">{i.icon}</div>
            <div className="notif-row-text">{i.title}</div>
            <div className="notif-row-date">{i.days===0?"сегодня":`через ${i.days} дн.`}</div>
          </div>)}
        </div>}
      </div>
    </div>
  </div>;
}

// ── App ───────────────────────────────────────────────────────────────────────
const TABS=[
  {id:"overview", label:"Профиль", icon:"🐾"},
  {id:"diagnoses",label:"Диагнозы",icon:"📋"},
  {id:"exams",    label:"Анализы", icon:"🔬"},
  {id:"visits",   label:"Визиты",  icon:"🏥"},
  {id:"vaccines", label:"Обработки",icon:"💉"},
  {id:"meds",     label:"Назначения",icon:"💊"},
  {id:"docs",     label:"Файлы",   icon:"📎"},
  {id:"history",  label:"История", icon:"🕐"},
];

function App(){
  const{data,loading,persist,saveState,exportJSON,importJSON}=useDB();
  const[tab,setTab]=useState("overview");
  const[showNotif,setShowNotif]=useState(false);

  const notifs=useMemo(()=>data?collectNotifications(data):[],[data]);
  const hasUrgent=notifs.some(n=>n.bucket==="overdue"||n.bucket==="today");

  if(loading)return <div className="loading">
    <div className="spinner"/>
    <div className="loading-title">Загружаем карту…</div>
    <div style={{fontSize:12,color:"var(--ink3)"}}>Подключение к Firebase</div>
  </div>;

  const di=data.dogInfo||{};
  const lastBio=[...(data.examinations||[])].filter(e=>e.type==="Биохимия").sort((a,b)=>parseDateMs(b.date)-parseDateMs(a.date))[0];

  return <div className="shell">
    <Toast state={saveState}/>
    {showNotif&&<NotifPanel items={notifs} onClose={()=>setShowNotif(false)}/>}

    {/* Header */}
    <div className="hdr">
      <div className="hdr-top">
        <div className="hdr-dog">
          <div className="hdr-avatar">
            {di.mainPhotoUrl?<img src={di.mainPhotoUrl} alt=""/>:"🐕"}
          </div>
          <div>
            <div className="hdr-name">{di.name||"Лаки Стар"}</div>
            <div className="hdr-sub">{di.breed} · {di.age} лет</div>
            <div className="hdr-save">
              {saveState==="saving"&&"☁️ сохраняется…"}
              {saveState==="saved"&&"✓ сохранено"}
              {saveState==="offline"&&"📴 офлайн"}
              {saveState==="idle"&&"☁️ Firebase"}
            </div>
          </div>
        </div>
        <div className="hdr-btns">
          <button className="icon-btn" onClick={()=>setShowNotif(true)}>
            🔔{hasUrgent&&<span className="notif-dot"/>}
          </button>
        </div>
      </div>
      <div className="hdr-stats">
        {[
          ["Вес",di.weight||"—"],
          ["Чип",di.microchip||"—"],
          ["Посл. анализ",lastBio?lastBio.date:"—"],
        ].map(([l,v])=><div key={l} className="hdr-stat">
          <div className="hdr-stat-val">{v}</div>
          <div className="hdr-stat-lbl">{l}</div>
        </div>)}
      </div>
    </div>

    {/* Alert */}
    <div className="alert-banner">
      <div className="alert-banner-icon">🚨</div>
      <div>
        <div className="alert-banner-title">Требует действий</div>
        <div className="alert-banner-body">
          • УЗИ 12.08.2026: <b>сладж 1,1 см</b> (было 0,35 см) — нужна коррекция лечения<br/>
          • Печень <b>+10%</b> от нормы и продолжает увеличиваться<br/>
          • ЭКГ 18.02.2026: возможная гипертрофия ЛЖ — <b>нужна эхокардиография</b>
        </div>
      </div>
    </div>

    {/* Content */}
    {tab==="overview"&&<TabOverview data={data} persist={persist}/>}
    {tab==="diagnoses"&&<TabDiagnoses data={data} persist={persist}/>}
    {tab==="exams"&&<TabExams data={data} persist={persist}/>}
    {tab==="visits"&&<TabVisits data={data} persist={persist}/>}
    {tab==="vaccines"&&<TabVaccinations data={data} persist={persist}/>}
    {tab==="meds"&&<TabPrescriptions data={data} persist={persist}/>}
    {tab==="docs"&&<TabDocs data={data} persist={persist}/>}
    {tab==="history"&&<TabHistory data={data} exportJSON={exportJSON} importJSON={importJSON}
      persistFromClaude={(newData,what)=>persist(newData,{what,section:"system"})}/>}

    {/* Bottom nav */}
    <div className="bnav">
      {TABS.map(t=><button key={t.id} className={`bnav-item${tab===t.id?" active":""}`} onClick={()=>setTab(t.id)}>
        <span className="bnav-icon">{t.icon}</span>{t.label}
      </button>)}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
