<style>
* { box-sizing: border-box; }
body { margin: 0; }

:root {

  --ink: #2B333B;
  --ink-soft: #8A93A0;

  --purple: #9B87D6;
  --purple-dark: #7C64C4;

  --good: var(--teal-dark);
  --good-soft: var(--teal-soft);
  --warn: var(--amber-dark);

}

.app-shell {

  max-width: 720px;

.loading-shell { display: flex; align-items: center; justify-content: center; min-height: 60vh; }

.app-header {

.app-header-left { display: flex; align-items: center; gap: 12px; }
.app-icon { background: #fff; color: var(--purple); width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 19px; box-shadow: 0 3px 8px -3px rgba(52,65,79,0.25); }

.contact-input { border: none; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink); font-family: 'Inter', sans-serif; }

/* Today dashboard */


/* Stats dashboard tiles */

.stat-tile { display: flex; flex-direction: column; gap: 8px; background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--tile-color, var(--navy)); border-radius: 14px; padding: 9px 10px 11px; cursor: pointer; text-align: left; font-family: 'Inter', sans-serif; transition: border-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease; box-shadow: 0 3px 10px -4px rgba(43,51,59,0.16); }

/* Notifications */
.notif-overlay { position: fixed; inset: 0; background: rgba(30,35,45,0.42); display: flex; align-items: flex-start; justify-content: center; padding: 64px 14px 14px; z-index: 60; }

.input {

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }

.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.field { display: flex; flex-direction: column; gap: 5px; }

.section { margin-top: 14px; padding: 16px 14px 18px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 8px -4px rgba(43,51,59,0.1); }

.log-text { flex: 1; color: var(--ink); min-width: 100px; }
.log-sub { font-size: 11.5px; color: var(--ink-soft); width: 100%; }
.icon-btn { background: none; border: none; color: var(--ink-faint); cursor: pointer; padding: 2px; display: flex; font-size: 13px; }
.icon-btn:hover { color: var(--danger); }

.add-row { display: flex; gap: 6px; flex-wrap: wrap; }

<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root && !root.hasChildNodes()) {
      var stack = (e.error && e.error.stack) ? e.error.stack : "";
      var fails = window.__loadFails && window.__loadFails.length
        ? '<br><br><b>Не загрузились файлы:</b> ' + window.__loadFails.join(", ")
        : '';
      root.innerHTML =
        '<div style="font-family: sans-serif; padding: 20px; color: #a33; background: #fff3f3; margin: 16px; border-radius: 12px; line-height:1.5; white-space: pre-wrap; word-break: break-word;">' +
        '<b>Ошибка загрузки приложения</b><br><br>' +
        (e.message || "Неизвестная ошибка") +
        fails +
        '<br><br><span style="color:#888; font-size: 13px;">Файл: ' + (e.filename || "?") + ", строка " + (e.lineno || "?") + '</span>' +
        (stack ? '<br><br><span style="color:#888; font-size: 12px;">' + stack + '</span>' : '') +
        '</div>';
    }
  });
  window.addEventListener("load", function () {
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && !root.hasChildNodes()) {
        var fails = window.__loadFails && window.__loadFails.length
          ? '<br><br><b>Не загрузились файлы:</b> ' + window.__loadFails.join(", ")
          : '<br><br>Явной ошибки не зафиксировано — вероятно, проблема в самом коде приложения (ошибка при разборе/сборке скрипта). Пришлите этот текст разработчику.';
        root.innerHTML =
          '<div style="font-family: sans-serif; padding: 20px; color: #a33; background: #fff3f3; margin: 16px; border-radius: 12px; line-height:1.5;">' +
          '<b>Приложение не открылось</b>' + fails + '</div>';
      }
    }, 3000);
  });
</script>

const SEX_OPTIONS = ["неизвестно", "кобель", "сука"];

function pad(n) { return String(n).padStart(3, "0"); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function uid(prefix) { return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`; }

// Превращает обычную ссылку "поделиться" с Google Диска в прямую ссылку на картинку.
// Понимает форматы: /file/d/ID/view, ?id=ID, /open?id=ID, uc?id=ID, thumbnail?id=ID.
// Остальные ссылки (не Google Drive) возвращает как есть.
function normalizePhotoUrl(raw) {
  const url = (raw || "").trim();
  if (!url) return url;
  const match =
    url.match(/drive\.google\.com\/file\/d\/([^/]+)/) ||
    url.match(/[?&]id=([^&]+)/);
  if (match && url.includes("drive.google.com")) {
    const fileId = match[1];
    return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
  }
  return url;
}

// Загружает файл в Firebase Storage и возвращает промис с прямой ссылкой на скачивание.
// folder — подпапка (например "photos" или "documents"), onProgress(0-100) — необязательный колбэк.
function uploadFileToStorage(file, folder, onProgress) {
  return new Promise((resolve, reject) => {
    if (!storage) {
      reject(new Error("Firebase Storage не инициализирован"));
      return;
    }
    const safeName = file.name.replace(/[^\w.\-]+/g, "_");
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${safeName}`;
    const task = storage.ref(path).put(file);
    task.on(
      "state_changed",
      (snap) => {
        if (onProgress) onProgress(Math.round((snap.bytesTransferred / snap.totalBytes) * 100));
      },
      (err) => reject(err),
      () => task.snapshot.ref.getDownloadURL().then(resolve).catch(reject)
    );
  });
}

function blankDog(num) {
  return {
    id: `dog-${Date.now()}-${num}`,
    number: pad(num),
    name: `Щенок №${num}`,
    sex: "неизвестно",
    color: "",
    status: "в приюте",
    arrivalDate: "",
    arrivalSource: "",
    ageEntries: [],
    medicalLog: [],
    treatmentCourses: [],
    photos: [],
    documents: [],
    traits: [],
    notes: "",
    migratedV3: true,
    createdAt: todayISO(),
  };
}

function seedDogs(count) {
  const dogs = [];
  for (let i = 1; i <= count; i++) dogs.push(blankDog(i));
  return dogs;
}

function fmtDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  const months = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  return `${day} ${months[parseInt(m, 10) - 1]} ${y}`;
}

// migrates any older card shape (pre-tabs, unified "treatments" log, "в передержке" status, etc.)
// into the current schema without losing anything already recorded.
function fixRetiredStatus(status) {
  if (status === "в передержке" || status === "на передержке") return "в приюте";
  if (status === "ищет дом") return "в приюте";
  return status || "в приюте";
}

function migrateDog(d) {
  if (d.migratedV3) {
    return {
      medicalLog: [], treatmentCourses: [], photos: [], documents: [], traits: [],
      ...d,
      status: fixRetiredStatus(d.status),
    };
  }
  let vaccinations = d.vaccinations || [];
  let parasites = d.parasites || [];
  let sterilizations = d.sterilizations || [];
  let otherMedEvents = d.otherMedEvents || [];
  if (!d.migratedV2) {
    const legacy = d.treatments || [];
    vaccinations = legacy.filter((t) => t.type === "Вакцинация").map((t) => ({
      id: t.id, date: t.date, name: t.note || "Вакцинация", nextDate: "", vet: "",
    }));
    parasites = legacy.filter((t) => t.type === "От глистов" || t.type === "От блох/клещей").map((t) => ({
      id: t.id, date: t.date, type: t.type === "От глистов" ? "от глистов" : "от блох/клещей", product: t.note || "", nextDate: "",
    }));
    sterilizations = legacy.filter((t) => t.type === "Стерилизация").map((t) => ({
      id: t.id, date: t.date, note: t.note || "",
    }));
    otherMedEvents = legacy.filter((t) => !["Вакцинация", "От глистов", "От блох/клещей", "Стерилизация"].includes(t.type)).map((t) => ({
      id: t.id, date: t.date, type: t.type, note: t.note || "",
    }));
    if (d.sterilized && d.sterilized !== "не стерилизован(а)" && sterilizations.length === 0) {
      sterilizations.push({
        id: uid("st"), date: d.createdAt || todayISO(),
        note: d.sterilized === "запланирована" ? "запланирована (перенесено со старой карточки)" : "перенесено со старой карточки",
      });
    }
  }
  const medicalLog = [
    ...vaccinations.map((v) => ({ id: v.id, date: v.date, type: "Вакцинация", note: [v.name, v.vet].filter(Boolean).join(" · "), nextDate: v.nextDate || "" })),
    ...parasites.map((p) => ({ id: p.id, date: p.date, type: p.type === "от глистов" ? "От глистов" : "От блох/клещей", note: p.product || "", nextDate: p.nextDate || "" })),
    ...sterilizations.map((s) => ({ id: s.id, date: s.date, type: "Стерилизация", note: s.note || "", nextDate: "" })),
    ...otherMedEvents.map((o) => ({ id: o.id, date: o.date, type: o.type || "Другое", note: o.note || "", nextDate: "" })),
    ...(d.medicalLog || []),
  ];
  const {
    sterilized, treatments, city, contact, migratedV2,
    vaccinations: _v, parasites: _p, sterilizations: _s, otherMedEvents: _o,
    ...rest
  } = d;
  const status = fixRetiredStatus(d.status);
  return {
    ...rest, status, medicalLog, treatmentCourses: d.treatmentCourses || [],
    photos: d.photos || [], documents: d.documents || [], traits: d.traits || [],
    migratedV3: true,
  };
}

function normalizeLoaded(parsed) {
  let rawDogs, meta;
  if (Array.isArray(parsed)) { rawDogs = parsed; meta = { ...EMPTY_META }; }
  else { rawDogs = parsed.dogs || []; meta = { ...EMPTY_META, ...(parsed.meta || {}) }; }
  const dogs = rawDogs.map(migrateDog);
  return { meta, dogs };
}

function useDB() {
  const [dogs, setDogs] = useState(null);
  const [meta, setMeta] = useState(EMPTY_META);
  const [loading, setLoading] = useState(true);
  const [saveState, setSaveState] = useState("idle");
  const [storageAvailable, setStorageAvailable] = useState(true);
  const latest = useRef(null);
  const seeding = useRef(false);

  const persist = useCallback((next) => {
    latest.current = next;
    setDogs(next.dogs);
    setMeta(next.meta);
    setSaveState("saving");
    DOC_REF.set(next)
      .then(() => {
        setSaveState("saved");
        setTimeout(() => setSaveState((s) => (s === "saved" ? "idle" : s)), 1200);
      })
      .catch((e) => { console.error("Не удалось сохранить в общую базу:", e); setSaveState("error"); });
  }, []);

  useEffect(() => {
    const unsubscribe = DOC_REF.onSnapshot(
      (snap) => {
        setStorageAvailable(true);
        if (snap.exists) {
          const loaded = normalizeLoaded(snap.data());
          latest.current = loaded;
          setDogs(loaded.dogs);
          setMeta(loaded.meta);
        } else if (!seeding.current) {
          seeding.current = true;
          const seeded = { meta: { ...EMPTY_META }, dogs: seedDogs(70) };
          latest.current = seeded;
          setDogs(seeded.dogs);
          setMeta(seeded.meta);
          DOC_REF.set(seeded).catch((e) => console.error("Не удалось создать начальную базу:", e));
        }
        setLoading(false);
      },
      (err) => {
        console.error("Firestore недоступен:", err);
        setStorageAvailable(false);
        setSaveState("local");
        if (!latest.current) {
          const seeded = { meta: { ...EMPTY_META }, dogs: seedDogs(70) };
          latest.current = seeded;
          setDogs(seeded.dogs);
          setMeta(seeded.meta);
        }
        setLoading(false);
      }
    );
    return () => unsubscribe();
  }, []);

  const retry = useCallback(() => { if (latest.current) persist(latest.current); }, [persist]);
  const loadFromBackup = useCallback((parsed) => persist(normalizeLoaded(parsed)), [persist]);
  return { dogs, meta, loading, persist, saveState, retry, storageAvailable, loadFromBackup };
}

function Chip({ children, tone = "muted" }) {
  return <span className={`chip chip-${tone}`}>{children}</span>;
}

function lastSterilization(dog) {
  const entries = (dog.medicalLog || []).filter((e) => e.type === "Стерилизация");
  return entries.length ? entries[entries.length - 1] : null;
}
function mainPhoto(dog) {
  const photos = dog.photos || [];
  if (!photos.length) return null;
  return photos.find((p) => p.id === dog.mainPhotoId) || photos[0];
}
function isOverdueOrDueSoon(dateStr, daysAhead = 30) {
  if (!dateStr) return false;
  const target = new Date(dateStr);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() + daysAhead);
  return target <= cutoff;
}
function vaccinationDue(dog) {
  return (dog.medicalLog || []).some((e) => e.type === "Вакцинация" && isOverdueOrDueSoon(e.nextDate));
}
function parasiteDue(dog) {
  return (dog.medicalLog || []).some((e) => (e.type === "От глистов" || e.type === "От блох/клещей") && isOverdueOrDueSoon(e.nextDate));
}
function hasActiveTreatment(dog) {
  const today = todayISO();
  return (dog.treatmentCourses || []).some((c) => !c.endDate || c.endDate >= today);
}
function collectNotifications(dogs) {
  const today = todayISO();
  const future = new Date();
  future.setDate(future.getDate() + 7);
  const in7 = future.toISOString().slice(0, 10);
  const buckets = { overdue: [], today: [], soon: [] };
  const classify = (dateStr) => {
    if (!dateStr) return null;
    if (dateStr < today) return "overdue";
    if (dateStr === today) return "today";
    if (dateStr <= in7) return "soon";
    return null;
  };
  const CATEGORY_LABEL = {
    vaccination: { one: "вакцинация", few: "вакцинации", many: "вакцинаций", icon: "💉" },
    parasite: { one: "обработка", few: "обработки", many: "обработок", icon: "🧴" },
    vetcheck: { one: "ветеринарный контроль", few: "ветеринарных контроля", many: "ветеринарных контролей", icon: "🩺" },
    course: { one: "курс лекарств заканчивается", few: "курса лекарств заканчиваются", many: "курсов лекарств заканчивается", icon: "💊" },
  };
  (dogs || []).forEach((dog) => {
    (dog.medicalLog || []).forEach((e) => {
      const bucket = classify(e.nextDate);
      if (!bucket) return;
      let category = null;
      if (e.type === "Вакцинация") category = "vaccination";
      else if (e.type === "От глистов" || e.type === "От блох/клещей") category = "parasite";
      else if (e.type === "Ветосмотр") category = "vetcheck";
      if (!category) return;
      buckets[bucket].push({ dogId: dog.id, dogName: dog.name, dogNumber: dog.number, category, date: e.nextDate });
    });
    (dog.treatmentCourses || []).forEach((c) => {
      const bucket = classify(c.endDate);
      if (!bucket) return;
      buckets[bucket].push({ dogId: dog.id, dogName: dog.name, dogNumber: dog.number, category: "course", date: c.endDate });
    });
  });
  const summarize = (items) => {
    const byCategory = {};
    items.forEach((it) => {
      if (!byCategory[it.category]) byCategory[it.category] = [];
      byCategory[it.category].push(it);
    });
    return Object.keys(byCategory).map((cat) => ({
      category: cat,
      label: CATEGORY_LABEL[cat],
      items: byCategory[cat],
      count: byCategory[cat].length,
    }));
  };
  const total = buckets.overdue.length + buckets.today.length + buckets.soon.length;
  return {
    total,
    overdue: summarize(buckets.overdue),
    today: summarize(buckets.today),
    soon: summarize(buckets.soon),
  };
}
function pluralRu(n, forms) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return forms.one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return forms.few;
  return forms.many;
}
function recordCount(dog) {
  return (dog.medicalLog || []).length + (dog.treatmentCourses || []).length;
}

// Проверяет, есть ли у собаки просроченная или скорая (в течение месяца) вакцинация/обработка.
// Возвращает { overdue, date, label } или null, если ничего срочного нет.
function careWarning(dog, daysAhead = 30) {
  const today = todayISO();
  const future = new Date();
  future.setDate(future.getDate() + daysAhead);
  const futureISO = future.toISOString().slice(0, 10);
  const TYPE_LABEL = { "Вакцинация": "вакцинация", "От глистов": "обработка", "От блох/клещей": "обработка" };
  let best = null;
  (dog.medicalLog || []).forEach((e) => {
    const label = TYPE_LABEL[e.type];
    if (!label || !e.nextDate || e.nextDate > futureISO) return;
    const overdue = e.nextDate < today;
    if (!best || (overdue && !best.overdue) || (overdue === best.overdue && e.nextDate < best.date)) {
      best = { overdue, date: e.nextDate, label };
    }
  });
  return best;
}

function CareWarningBadge({ dog }) {
  const warn = careWarning(dog);
  if (!warn) return null;
  return (
    <div className={`care-warning ${warn.overdue ? "care-warning-overdue" : "care-warning-soon"}`}>
      ⚠️ {warn.overdue ? "Просрочена" : "Скоро"} {warn.label} · {fmtDate(warn.date)}
    </div>
  );
}

function DogCard({ dog, index, onOpen }) {
  const ster = lastSterilization(dog);
  const photo = mainPhoto(dog);
  const stripe = ROW_STRIPE_CYCLE[index % ROW_STRIPE_CYCLE.length];
  const count = recordCount(dog);
  return (
    <button className="kcard" style={{ "--stripe": stripe }} onClick={() => onOpen(dog.id)}>
      <div className="kcard-photo">
        {photo ? <img src={normalizePhotoUrl(photo.url)} alt={dog.name} style={{ objectPosition: `${photo.posX ?? 50}% ${photo.posY ?? 50}%` }} /> : <span className="kcard-photo-placeholder">🐾</span>}
      </div>
      <div className="kcard-top">
        <span className="kcard-number">№{dog.number}</span>
        {count > 0 ? <Chip tone="good">{count} записей</Chip> : <Chip tone="muted">нет записей</Chip>}

/* ---------- Dog detail with tabs ---------- */

function DogDetail({ dog, onBack, onUpdate, onDelete }) {
  const [local, setLocal] = useState(dog);
  const [newAge, setNewAge] = useState("");
  const [newAgeDate, setNewAgeDate] = useState(todayISO());
  const [confirmDelete, setConfirmDelete] = useState(false);
  const debounceTimers = useRef({});

  useEffect(() => { setLocal(dog); }, [dog.id]);
  useEffect(() => () => { Object.values(debounceTimers.current).forEach((t) => t && t.flush && t.flush()); }, []);

  const commitNow = (patch) => { const next = { ...local, ...patch }; setLocal(next); onUpdate(next); };
  const commitDebounced = (key, patch, delay = 500) => {
    const next = { ...local, ...patch };
    setLocal(next);
    if (debounceTimers.current[key]) clearTimeout(debounceTimers.current[key].id);
    const id = setTimeout(() => onUpdate(next), delay);
    debounceTimers.current[key] = { id, flush: () => onUpdate(next) };
  };
  const handleBack = () => { Object.values(debounceTimers.current).forEach((t) => t && t.flush && t.flush()); onBack(); };

  const addAge = () => {
    if (!newAge.trim()) return;
    commitNow({ ageEntries: [...local.ageEntries, { id: uid("a"), date: newAgeDate, note: newAge.trim() }] });
    setNewAge("");
  };
  const removeAge = (id) => commitNow({ ageEntries: local.ageEntries.filter((e) => e.id !== id) });

  const addTo = (key) => (entry) => commitNow({ [key]: [...(local[key] || []), entry] });
  const removeFrom = (key) => (id) => commitNow({ [key]: (local[key] || []).filter((e) => e.id !== id) });

  const toggleTrait = (t) => {
    const has = (local.traits || []).includes(t);
    commitNow({ traits: has ? local.traits.filter((x) => x !== t) : [...(local.traits || []), t] });
  };

  const removePhoto = (id) => {
    const photos = (local.photos || []).filter((p) => p.id !== id);
    const patch = { photos };
    if (local.mainPhotoId === id) patch.mainPhotoId = photos[0] ? photos[0].id : null;
    commitNow(patch);
  };
  const heroFileInputRef = useRef(null);
  const [heroUploading, setHeroUploading] = useState(false);
  const heroContainerRef = useRef(null);
  const localRef = useRef(local);
  useEffect(() => { localRef.current = local; }, [local]);
  const dragInfo = useRef(null);
  const [isDragging, setIsDragging] = useState(false);
  const startPhotoDrag = (clientX, clientY) => {
    const currentPhoto = mainPhoto(local);
    if (!currentPhoto) return;
    dragInfo.current = {
      startX: clientX, startY: clientY,
      startPosX: currentPhoto.posX ?? 50, startPosY: currentPhoto.posY ?? 50,
      photoId: currentPhoto.id,
    };
    setIsDragging(true);
  };
  const movePhotoDrag = (clientX, clientY) => {
    if (!dragInfo.current || !heroContainerRef.current) return;
    const rect = heroContainerRef.current.getBoundingClientRect();
    const deltaXPercent = ((clientX - dragInfo.current.startX) / rect.width) * 100;
    const deltaYPercent = ((clientY - dragInfo.current.startY) / rect.height) * 100;
    const newPosX = Math.min(100, Math.max(0, dragInfo.current.startPosX - deltaXPercent));
    const newPosY = Math.min(100, Math.max(0, dragInfo.current.startPosY - deltaYPercent));
    setLocal((prev) => ({
      ...prev,
      photos: (prev.photos || []).map((p) => p.id === dragInfo.current.photoId ? { ...p, posX: newPosX, posY: newPosY } : p),
    }));
  };
  const endPhotoDrag = () => {
    if (!dragInfo.current) return;
    dragInfo.current = null;
    setIsDragging(false);
    onUpdate(localRef.current);
  };
  const addPhotoFromHero = () => {
    heroFileInputRef.current && heroFileInputRef.current.click();
  };
  const handleHeroFilePick = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setHeroUploading(true);
    uploadFileToStorage(file, "photos")
      .then((downloadUrl) => {
        const p = { id: uid("ph"), url: downloadUrl };
        commitNow({ photos: [...(local.photos || []), p], mainPhotoId: local.mainPhotoId || p.id });
        setHeroUploading(false);
      })
      .catch((err) => {
        console.error(err);
        alert("Не удалось загрузить фото. Проверьте интернет и попробуйте снова.");
        setHeroUploading(false);
      });
  };

  const ster = lastSterilization(local);
  const photo = mainPhoto(local);
  const sexIcon = local.sex === "сука" ? "♀" : local.sex === "кобель" ? "♂" : "•";
  const sexTone = local.sex === "сука" ? "rose" : local.sex === "кобель" ? "navy" : "slate";

  return (
    <div className="detail">
      <div className="detail-topbar">
        <button className="back-btn" onClick={handleBack} title="Назад">‹</button>
        <span className="detail-topbar-title">Карточка №{local.number}</span>
        <button className="round-icon-btn" title="Ещё">⋮</button>
      </div>

      <div
        className="detail-photo-hero"
        ref={heroContainerRef}
        onPointerDown={(e) => { e.currentTarget.setPointerCapture(e.pointerId); startPhotoDrag(e.clientX, e.clientY); }}
        onPointerMove={(e) => { if (dragInfo.current) movePhotoDrag(e.clientX, e.clientY); }}
        onPointerUp={endPhotoDrag}
        onPointerCancel={endPhotoDrag}
      >
        {photo ? (
          <img
            src={normalizePhotoUrl(photo.url)}
            alt=""
            style={{ objectPosition: `${photo.posX ?? 50}% ${photo.posY ?? 50}%`, touchAction: "none", cursor: isDragging ? "grabbing" : "grab" }}
          />
        ) : <span className="kcard-photo-placeholder">🐾</span>}
        {photo && <div className="hero-drag-hint">✋ Двигайте фото пальцем, чтобы выбрать ракурс</div>}
        <input type="file" accept="image/*" ref={heroFileInputRef} style={{ display: "none" }} onChange={handleHeroFilePick} />
        <button className="hero-camera-btn" onPointerDown={(e) => e.stopPropagation()} onClick={addPhotoFromHero} title="Добавить фото" disabled={heroUploading}>{heroUploading ? "…" : "📷"}</button>
      </div>

      <div className="detail-body">
        <div className="detail-headline">
          <input
            className="detail-name-input"
            defaultValue={local.name}
            onChange={(e) => commitDebounced("name", { name: e.target.value })}
            onBlur={() => debounceTimers.current.name && debounceTimers.current.name.flush()}
            placeholder="Кличка"
          />
          <span className={`sex-badge sex-badge-${sexTone}`}>{sexIcon}</span>
        </div>
        <CareWarningBadge dog={local} />

        <div className="detail-grid">
          <Field label="Пол">
            <select className="input" value={local.sex} onChange={(e) => commitNow({ sex: e.target.value })}>
              {SEX_OPTIONS.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </Field>
          <Field label="Окрас">
            <input className="input" defaultValue={local.color} onChange={(e) => commitDebounced("color", { color: e.target.value })} onBlur={() => debounceTimers.current.color && debounceTimers.current.color.flush()} placeholder="напр. чёрно-белый" />
          </Field>
          <Field label="Статус">
            <select className="input" value={local.status} onChange={(e) => commitNow({ status: e.target.value })}>
              {STATUS_OPTIONS.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </Field>
          <Field label="Стерилизация">
            <div className="ster-readout">
              {ster ? <Chip tone="good">стерилизован(а) · {fmtDate(ster.date)}</Chip> : <Chip tone="muted">не стерилизован(а)</Chip>}

        </div>

        <section className="section">

        <DocumentsSection documents={local.documents || []} onAdd={addTo("documents")} onRemove={removeFrom("documents")} />

        <div className="danger-zone">
          {!confirmDelete ? (
            <button className="delete-btn" onClick={() => setConfirmDelete(true)}>🗑️ Удалить карточку</button>
          ) : (
            <div className="confirm-row">
              <span>⚠️ Удалить карточку «{local.name}» без возможности восстановления?</span>
              <button className="delete-btn-confirm" onClick={() => onDelete(local.id)}>Да, удалить</button>
              <button className="cancel-btn" onClick={() => setConfirmDelete(false)}>Отмена</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function SharedContactBar({ meta, onChange }) {
  const [local, setLocal] = useState(meta);
  const timers = useRef({});
  useEffect(() => setLocal(meta), [meta.city, meta.contact]);
  const commitDebounced = (key, patch, delay = 500) => {
    const next = { ...local, ...patch };
    setLocal(next);
    if (timers.current[key]) clearTimeout(timers.current[key].id);
    const id = setTimeout(() => onChange(next), delay);
    timers.current[key] = { id, flush: () => onChange(next) };
  };
  return (
    <div className="contact-bar">
      <div className="contact-field">
        <span>📍</span>
        <input className="contact-input" placeholder="Город" defaultValue={local.city}
          onChange={(e) => commitDebounced("city", { city: e.target.value })}
          onBlur={() => timers.current.city && timers.current.city.flush()} />
      </div>
      <div className="contact-field">
        <span>📱</span>
        <input className="contact-input" placeholder="Телефон / соцсеть" defaultValue={local.contact}
          onChange={(e) => commitDebounced("contact", { contact: e.target.value })}
          onBlur={() => timers.current.contact && timers.current.contact.flush()} />
      </div>
    </div>
  );
}

function NotificationsPanel({ dogs, onClose, onOpenDog }) {
  const data = useMemo(() => collectNotifications(dogs), [dogs]);
  const [expanded, setExpanded] = useState(null);

  const Section = ({ title, tone, groups }) => {
    if (groups.length === 0) return null;
    return (
      <div className={`notif-section notif-section-${tone}`}>
        <div className="notif-section-title">{title}</div>
        {groups.map((g) => {
          const key = `${title}-${g.category}`;
          const isOpen = expanded === key;
          return (
            <div key={key} className="notif-row-wrap">
              <button className="notif-row" onClick={() => setExpanded(isOpen ? null : key)}>
                <span className="notif-row-icon">{g.label.icon}</span>
                <span className="notif-row-text">{g.count} {pluralRu(g.count, g.label)}</span>
                <span className="notif-row-chevron">{isOpen ? "︿" : "﹀"}</span>
              </button>
              {isOpen && (
                <div className="notif-detail-list">
                  {g.items.map((it, i) => (
                    <button key={i} className="notif-detail-item" onClick={() => { onOpenDog(it.dogId); onClose(); }}>
                      №{it.dogNumber} · {it.dogName} <span className="notif-detail-date">{fmtDate(it.date)}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  };

  return (
    <div className="notif-overlay" onClick={onClose}>
      <div className="notif-panel" onClick={(e) => e.stopPropagation()}>
        <div className="notif-panel-header">
          <span>🔔 Уведомления</span>
          <button className="round-icon-btn" onClick={onClose}>✕</button>
        </div>
        {data.total === 0 ? (
          <div className="empty-hint" style={{ padding: 20 }}>Пока всё в порядке — просроченных и ближайших дел нет.</div>
        ) : (
          <div className="notif-body">
            <Section title="Сегодня" tone="today" groups={data.today} />
            <Section title="Через 7 дней" tone="soon" groups={data.soon} />
            <Section title="Просрочено" tone="overdue" groups={data.overdue} />
          </div>
        )}
      </div>
    </div>
  );
}

function StatsPanel({ dogs, dueFilter, onSetDueFilter }) {
  const placed = dogs.filter((d) => d.status === "пристроен").length;
  const sterilized = dogs.filter((d) => lastSterilization(d)).length;
  const needCare = dogs.filter((d) => hasActiveTreatment(d) || vaccinationDue(d) || parasiteDue(d)).length;
  const tiles = [
    { key: "all", icon: "🐾", num: dogs.length, label: "Всего животных", color: "var(--navy)", soft: "var(--navy-soft)" },
    { key: "placed", icon: "❤️", num: placed, label: "Пристроено", color: "var(--rose-dark)", soft: "var(--rose-soft)" },
    { key: "sterilized", icon: "🛡️", num: sterilized, label: "Стерилизовано", color: "var(--teal-dark)", soft: "var(--teal-soft)" },
    { key: "care", icon: "🤲", num: needCare, label: "Требуют лечения", color: "var(--purple-dark)", soft: "var(--purple-soft)" },
  ];
  return (
    <div className="stats-row">
      {tiles.map((t) => (
        <button
          key={t.key}
          className={`stat-tile ${dueFilter === t.key ? "active" : ""}`}
          style={{ "--tile-color": t.color, "--tile-soft": t.soft }}
          onClick={() => onSetDueFilter(dueFilter === t.key ? null : t.key)}
        >
          <span className="stat-icon">{t.icon}</span>
          <span className="stat-num">{t.num}</span>
          <span className="stat-label">{t.label}</span>
        </button>
      ))}
    </div>
  );
}

function StatsScreen({ dogs, dueFilter, onSetDueFilter }) {
  const byStatus = STATUS_OPTIONS.map((s) => ({
    status: s, count: dogs.filter((d) => d.status === s).length,
  }));
  return (
    <div>
      <StatsPanel dogs={dogs} dueFilter={dueFilter} onSetDueFilter={onSetDueFilter} />
      <div className="section">
        <div className="section-title">По статусам</div>
        <div className="log-list">
          {byStatus.map((row) => (
            <div key={row.status} className="log-row">
              <span className="status-dot" style={{ background: STATUS_COLORS[row.status] }}></span>
              <span className="log-text" style={{ textTransform: "capitalize" }}>{row.status}</span>
              <Chip tone={STATUS_CHIP_TONE[row.status] || "muted"}>{row.count}</Chip>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function BottomNav({ screen, onSetScreen, onAdd }) {
  return (
    <nav className="bottom-nav">
      <button className={`bottom-nav-item ${screen === "home" ? "active" : ""}`} onClick={() => onSetScreen("home")}>
        <span className="bottom-nav-icon">🏠</span>
        <span>Главная</span>
      </button>
      <button className="bottom-nav-add" onClick={onAdd} title="Добавить карточку">➕</button>
      <button className={`bottom-nav-item ${screen === "stats" ? "active" : ""}`} onClick={() => onSetScreen("stats")}>
        <span className="bottom-nav-icon">📊</span>
        <span>Статистика</span>
      </button>
    </nav>
  );
}

function App() {
  const { dogs, meta, loading, persist, saveState, retry, storageAvailable, loadFromBackup } = useDB();
  const [openId, setOpenId] = useState(null);
  const [showNotifications, setShowNotifications] = useState(false);
  const [screen, setScreen] = useState("home");
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("все");
  const [dueFilter, setDueFilter] = useState(null);
  const [viewMode, setViewMode] = useState("grid");
  const [importError, setImportError] = useState("");
  const fileInputRef = useRef(null);

  const filtered = useMemo(() => {
    if (!dogs) return [];
    return dogs.filter((d) => {
      const matchesQuery = !query || d.name.toLowerCase().includes(query.toLowerCase()) || d.number.includes(query);
      const matchesStatus = statusFilter === "все" || d.status === statusFilter;
      let matchesDue = true;
      if (dueFilter === "placed") matchesDue = d.status === "пристроен";
      if (dueFilter === "sterilized") matchesDue = !!lastSterilization(d);
      if (dueFilter === "care") matchesDue = hasActiveTreatment(d) || vaccinationDue(d) || parasiteDue(d);
      return matchesQuery && matchesStatus && matchesDue;
    });
  }, [dogs, query, statusFilter, dueFilter]);

  const openDog = openId && dogs ? dogs.find((d) => d.id === openId) : null;

  const updateDog = (updated) => persist({ meta, dogs: dogs.map((d) => (d.id === updated.id ? updated : d)) });
  const deleteDog = (id) => { persist({ meta, dogs: dogs.filter((d) => d.id !== id) }); setOpenId(null); };
  const addDog = () => {
    const maxNum = dogs.reduce((m, d) => Math.max(m, parseInt(d.number, 10) || 0), 0);
    const newDog = blankDog(maxNum + 1);
    persist({ meta, dogs: [...dogs, newDog] });
    setOpenId(newDog.id);
  };
  const setDueFilterAndShowList = (key) => { setDueFilter(key); setScreen("home"); };
  const updateMeta = (nextMeta) => persist({ meta: nextMeta, dogs });

  const downloadBackup = () => {
    const payload = { meta, dogs };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    a.href = url; a.download = `dog-kart-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  };
  const triggerImport = () => fileInputRef.current && fileInputRef.current.click();
  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImportError("");
    const reader = new FileReader();
    reader.onload = () => {
      try { loadFromBackup(JSON.parse(reader.result)); }
      catch (err) { setImportError("Не получилось прочитать файл — убедитесь, что это резервная копия, скачанная отсюда же."); }
    };
    reader.onerror = () => setImportError("Не получилось прочитать файл.");
    reader.readAsText(file);
  };

  const notifTotal = useMemo(() => (dogs ? collectNotifications(dogs).total : 0), [dogs]);

  if (loading || !dogs) {
    return <div className="app-shell loading-shell"><div className="loading-text">🐾 Открываем картотеку…</div></div>;
  }

  const placed = dogs.filter((d) => d.status === "пристроен").length;
  const needsAttention = dogs.filter((d) => hasActiveTreatment(d) || vaccinationDue(d) || parasiteDue(d)).length;

  return (
    <div className={`app-shell ${!openDog ? "has-bottom-nav" : ""}`}>
      <header className="app-header">
        <div className="app-header-left">
          <div className="app-icon">🐾</div>
          <div>
            <div className="app-title">Картотека приюта</div>
            <div className="app-subtitle">{dogs.length} карточек · {placed} пристроено</div>
          </div>
        </div>
        <div className={`save-indicator save-${saveState}`}>
          {saveState === "saved" && "✅ сохранено"}
          {saveState === "error" && <button className="retry-btn" onClick={retry}>🔄 не сохранилось, повторить</button>}
          {saveState === "local" && <button className="retry-btn" onClick={retry}>📴 офлайн, проверить снова</button>}
          {(saveState === "idle" || saveState === "saving") && (
            <button className="bell-btn" onClick={() => setShowNotifications(true)}>🔔{notifTotal > 0 && <span className="bell-dot"></span>}</button>
          )}
        </div>
      </header>

      {saveState === "error" && (
        <div className="error-banner">⚠️ Последнее изменение не сохранилось в общей базе. Нажмите «повторить» справа вверху.</div>
      )}
      {!storageAvailable && (
        <div className="local-banner">
          <span>📴</span>
          <div className="local-banner-text">Нет связи с общей базой — изменения хранятся только на этом экране. Скачайте резервную копию, если сейчас важные правки.</div>
          <div className="backup-actions">
            <button className="backup-btn backup-btn-primary" onClick={downloadBackup}>⬇️ Скачать копию</button>
            <button className="backup-btn backup-btn-secondary" onClick={triggerImport}>⬆️ Загрузить копию</button>
          </div>
          {importError && <div className="import-error">{importError}</div>}
          <input ref={fileInputRef} type="file" accept="application/json" className="hidden-file-input" onChange={handleImportFile} />
        </div>
      )}
      {storageAvailable && (
        <div className="backup-actions backup-actions-inline">
          <button className="backup-btn backup-btn-primary" onClick={downloadBackup}>⬇️ Скачать копию</button>
          <button className="backup-btn backup-btn-secondary" onClick={triggerImport}>⬆️ Загрузить копию</button>
          {importError && <div className="import-error">{importError}</div>}
          <input ref={fileInputRef} type="file" accept="application/json" className="hidden-file-input" onChange={handleImportFile} />
        </div>
      )}

      <SharedContactBar meta={meta} onChange={updateMeta} />

      {!openDog ? (
        <React.Fragment>
          {screen === "stats" ? (
            <StatsScreen dogs={dogs} dueFilter={dueFilter} onSetDueFilter={setDueFilterAndShowList} />
          ) : (
            <React.Fragment>
              <StatsPanel dogs={dogs} dueFilter={dueFilter} onSetDueFilter={setDueFilterAndShowList} />
              <div className="toolbar">
                <div className="search-box">
                  <span>🔍</span>
                  <input className="search-input" placeholder="Поиск по кличке или номеру..." value={query} onChange={(e) => setQuery(e.target.value)} />
                </div>
                <div className="view-toggle">
                  <button className={`view-toggle-btn ${viewMode === "grid" ? "active" : ""}`} onClick={() => setViewMode("grid")} title="Плитка">▦</button>
                  <button className={`view-toggle-btn ${viewMode === "list" ? "active" : ""}`} onClick={() => setViewMode("list")} title="Список">☰</button>
                </div>
              </div>
              <div className="pill-row">
                <button className={`pill-btn ${statusFilter === "все" && !dueFilter ? "active" : ""}`} onClick={() => { setStatusFilter("все"); setDueFilter(null); }}>Все</button>
                {STATUS_OPTIONS.map((s) => (
                  <button key={s} className={`pill-btn ${statusFilter === s ? "active" : ""}`} onClick={() => { setStatusFilter(s); setDueFilter(null); }}>{s}</button>
                ))}
              </div>
              {dueFilter && (
                <div className="active-due-note">
                  Показаны отфильтрованные по статистике карточки.
                  <button className="clear-due-btn" onClick={() => setDueFilter(null)}>✕ сбросить</button>
                </div>
              )}
              {viewMode === "grid" ? (
                <div className="grid">
                  {filtered.map((d, i) => <DogCard key={d.id} dog={d} index={i} onOpen={setOpenId} />)}
                  {filtered.length === 0 && <div className="empty-hint" style={{ padding: 24 }}>Ничего не найдено.</div>}
                </div>
              ) : (
                <div className="list-col">
                  {filtered.map((d, i) => <DogListRow key={d.id} dog={d} index={i} onOpen={setOpenId} />)}
                  {filtered.length === 0 && <div className="empty-hint" style={{ padding: 24 }}>Ничего не найдено.</div>}
                </div>
              )}
            </React.Fragment>
          )}
          <BottomNav screen={screen} onSetScreen={setScreen} onAdd={addDog} />
        </React.Fragment>
      ) : (
        <DogDetail dog={openDog} onBack={() => setOpenId(null)} onUpdate={updateDog} onDelete={deleteDog} />
      )}
      {showNotifications && (
        <NotificationsPanel dogs={dogs} onClose={() => setShowNotifications(false)} onOpenDog={(id) => { setOpenId(id); setScreen("home"); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW registration failed:", e));
  });
}
</script>
</body>
</html>
